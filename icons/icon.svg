<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EA"/>
      <stop offset="1" stop-color="#F0E9D8"/>
    </linearGradient>
    <linearGradient id="toile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E1CE"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <path d="M0 410 Q256 386 512 410 L512 512 L0 512 Z" fill="#A8E0C5"/>

  <!-- toit toile : pans droits, pic central, bords évasés -->
  <path d="M48 212 Q74 202 92 180 L174 130 L256 110 L338 130 L420 180 Q438 202 464 212 Z"
        fill="url(#toile)"/>
  <!-- ligne de faîtage -->
  <path d="M92 180 L174 130 L256 110 L338 130 L420 180"
        fill="none" stroke="#CFC6B0" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bandeau rouge -->
  <rect x="92" y="212" width="328" height="20" rx="4" fill="#C0392B"/>

  <!-- panneaux : vert / bleu marine / vert -->
  <rect x="100" y="232" width="86"  height="128" fill="#1E6B4F"/>
  <rect x="186" y="232" width="140" height="128" fill="#2B3A7A"/>
  <rect x="326" y="232" width="86"  height="128" fill="#1E6B4F"/>

  <!-- moustiquaire -->
  <rect x="212" y="254" width="88" height="82" rx="6" fill="#49555F"/>
  <g stroke="#7E8993" stroke-width="3" opacity=".8">
    <path d="M234 256 v78 M256 256 v78 M278 256 v78"/>
    <path d="M214 274 h84 M214 295 h84 M214 316 h84"/>
  </g>

  <!-- châssis remorque -->
  <rect x="90" y="360" width="332" height="32" rx="7" fill="#24407A"/>
  <circle cx="152" cy="396" r="26" fill="#2E3238"/>
  <circle cx="152" cy="396" r="9"  fill="#B9BDC2"/>
  <circle cx="328" cy="396" r="26" fill="#2E3238"/>
  <circle cx="328" cy="396" r="9"  fill="#B9BDC2"/>

  <!-- pastille checklist -->
  <circle cx="424" cy="428" r="60" fill="#C05B33"/>
  <path d="M394 428 l22 22 l40 -44" fill="none" stroke="#FFF" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
