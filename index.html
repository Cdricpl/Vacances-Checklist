<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#1E2F21">
<title>Checklist Vacances</title>
<style>
  :root{
    --radius:16px;
    --radius-sm:12px;
    --radius-pill:22px;
    --ease:cubic-bezier(.4,0,.2,1);

    --bg:#F1EBDD;
    --grad1:rgba(47,74,52,.06);
    --grad2:rgba(192,91,51,.06);
    --surface:#FCFAF4;
    --surface-2:#FFFFFF;
    --ink:#23301E;
    --muted:#8B846C;
    --line:#E6DEC8;
    --line-soft:#EFE9DA;
    --forest:#2F4A34;
    --forest-ink:#22331F;
    --accent:#C05B33;
    --accent-2:#D9784E;
    --moss:#6B8A5E;
    --done:#E6ECDC;
    --shadow:0 1px 2px rgba(30,40,25,.05),0 6px 22px rgba(30,40,25,.07);
    --shadow-lg:0 16px 48px rgba(18,28,16,.30);
    --header:#1E2F21;
    --header-ink:#F4F1E6;
    --header-soft:rgba(255,255,255,.62);
  }
  :root[data-theme="dark"]{
    --bg:#141C16;
    --grad1:rgba(120,160,120,.06);
    --grad2:rgba(217,120,78,.08);
    --surface:#1C2620;
    --surface-2:#212D25;
    --ink:#E8E4D5;
    --muted:#9AA28F;
    --line:#2C3A2E;
    --line-soft:#253228;
    --forest:#3E5D43;
    --forest-ink:#CFE3CC;
    --accent:#DB7B50;
    --accent-2:#E88E63;
    --moss:#84A574;
    --done:#233024;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.38);
    --shadow-lg:0 18px 52px rgba(0,0,0,.6);
    --header:#0F150F;
    --header-ink:#EAF0E4;
    --header-soft:rgba(233,240,228,.55);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141C16;
      --grad1:rgba(120,160,120,.06);
      --grad2:rgba(217,120,78,.08);
      --surface:#1C2620;
      --surface-2:#212D25;
      --ink:#E8E4D5;
      --muted:#9AA28F;
      --line:#2C3A2E;
      --line-soft:#253228;
      --forest:#3E5D43;
      --forest-ink:#CFE3CC;
      --accent:#DB7B50;
      --accent-2:#E88E63;
      --moss:#84A574;
      --done:#233024;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.38);
      --shadow-lg:0 18px 52px rgba(0,0,0,.6);
      --header:#0F150F;
      --header-ink:#EAF0E4;
      --header-soft:rgba(233,240,228,.55);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 8% 0%, var(--grad1), transparent 42%),
      radial-gradient(circle at 92% 100%, var(--grad2), transparent 46%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:96px;
    transition:background-color .3s var(--ease), color .3s var(--ease);
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:var(--header);
    color:var(--header-ink);
    padding:16px 18px 14px;
    box-shadow:0 6px 20px rgba(0,0,0,.16);
  }
  .head-top{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .head-top h1{
    margin:0;
    font-family:'Iowan Old Style',Georgia,'Times New Roman',serif;
    font-weight:700; font-size:1.34rem; letter-spacing:.2px;
    display:flex; align-items:center; gap:9px;
  }
  .head-actions{display:flex; gap:8px;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16);
    color:var(--header-ink); cursor:pointer; font-size:1.02rem;
    transition:transform .15s var(--ease), background .2s var(--ease);
  }
  .icon-btn:active{transform:scale(.9); background:rgba(255,255,255,.22);}

  .progress-wrap{margin-top:13px;}
  .progress-track{
    background:rgba(255,255,255,.14);
    border-radius:20px; height:9px; overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border-radius:20px;
    transition:width .5s var(--ease);
  }
  .progress-label{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:7px; font-size:.72rem; color:var(--header-soft); letter-spacing:.3px;
  }
  .progress-label b{color:var(--header-ink); font-weight:600;}

  .mini-actions{display:flex; gap:8px; margin-top:12px;}
  .chip-btn{
    flex:0 0 auto;
    display:inline-flex; align-items:center; gap:6px;
    font-size:.74rem; font-weight:500;
    background:rgba(255,255,255,.1);
    color:var(--header-ink);
    border:1px solid rgba(255,255,255,.16);
    padding:7px 13px; border-radius:var(--radius-pill);
    cursor:pointer; transition:transform .15s var(--ease), background .2s var(--ease);
  }
  .chip-btn:active{transform:scale(.95); background:rgba(255,255,255,.22);}

  /* ---------- Onglets ---------- */
  .tabs{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    display:flex; flex-wrap:wrap; gap:7px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    max-height:44vh; overflow-y:auto;
  }
  .tab{
    display:inline-flex; align-items:center; gap:7px;
    font-size:.77rem; font-weight:500; white-space:nowrap;
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line);
    padding:8px 12px; border-radius:var(--radius-pill);
    cursor:pointer;
    transition:transform .14s var(--ease), background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
  }
  .tab:active{transform:scale(.95);}
  .tab .t-ico{font-size:.95rem; line-height:1;}
  .tab .t-count{
    font-size:.66rem; color:var(--muted);
    background:var(--line-soft); padding:2px 7px; border-radius:10px;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .tab.active{
    background:var(--forest); color:#fff; border-color:var(--forest);
    box-shadow:0 4px 14px rgba(47,74,52,.28);
  }
  .tab.active .t-count{background:rgba(255,255,255,.22); color:#fff;}
  .tab.complete{border-color:var(--moss);}
  .tab.complete .t-count{background:var(--moss); color:#fff;}
  .tab.active.complete{background:var(--moss); border-color:var(--moss); box-shadow:0 4px 14px rgba(107,138,94,.32);}

  /* ---------- Contenu ---------- */
  main{max-width:620px; margin:0 auto; padding:16px 14px 0;}

  .cat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    animation:enter .32s var(--ease);
  }
  @keyframes enter{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  .cat-head{
    display:flex; align-items:center; gap:13px;
    padding:15px 16px;
    border-bottom:1px solid var(--line-soft);
  }
  .cat-ring{
    --p:0;
    position:relative; width:44px; height:44px; flex-shrink:0; border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--line-soft) 0);
    transition:background .5s var(--ease);
  }
  .cat-ring::after{
    content:""; position:absolute; inset:4px; border-radius:50%;
    background:var(--surface);
    display:block;
  }
  .cat-ring .ring-ico{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:1.15rem; z-index:1;
  }
  .cat-head .ct{flex:1; min-width:0;}
  .cat-head h2{
    margin:0; font-size:1.06rem; font-weight:700; color:var(--forest-ink);
    line-height:1.2;
  }
  .cat-head .sub{font-size:.74rem; color:var(--muted); margin-top:3px;}
  .toggle-all{
    flex-shrink:0;
    font-size:.72rem; font-weight:500;
    background:transparent; color:var(--accent);
    border:1px solid var(--line);
    padding:7px 11px; border-radius:var(--radius-pill);
    cursor:pointer; transition:transform .14s var(--ease), background .2s var(--ease);
  }
  .toggle-all:active{transform:scale(.94); background:var(--line-soft);}

  .items{list-style:none; margin:0; padding:4px;}
  .item{
    display:flex; align-items:center; gap:13px;
    padding:11px 12px; border-radius:var(--radius-sm);
    cursor:pointer;
    transition:background .25s var(--ease);
  }
  .item + .item{margin-top:1px;}
  .item:active{background:var(--line-soft);}
  .item.checked{background:var(--done);}

  .chk{
    width:24px; height:24px; min-width:24px; border-radius:7px;
    border:2px solid var(--moss);
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-2);
    transition:background .22s var(--ease), border-color .22s var(--ease);
  }
  .item.checked .chk{background:var(--moss); border-color:var(--moss);}
  .chk svg{width:15px; height:15px;}
  .chk svg polyline{
    stroke-dasharray:24; stroke-dashoffset:24;
    transition:stroke-dashoffset .3s var(--ease) .04s;
  }
  .item.checked .chk svg polyline{stroke-dashoffset:0;}

  .lbl{
    flex:1; min-width:0; font-size:.97rem; line-height:1.32;
    transition:color .25s var(--ease);
    word-break:break-word;
  }
  .item.checked .lbl{
    color:var(--muted);
    text-decoration:line-through; text-decoration-color:var(--moss);
  }
  .tools{display:flex; align-items:center; gap:1px; flex-shrink:0;}
  .t-btn{
    width:34px; height:34px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--muted);
    cursor:pointer; font-size:1rem;
    transition:transform .14s var(--ease), background .2s var(--ease), color .2s var(--ease);
  }
  .t-btn:active{transform:scale(.86);}
  .t-btn.edit:active{color:var(--forest); background:var(--line-soft);}
  .t-btn.del:active{color:var(--accent); background:var(--line-soft);}

  .empty{padding:26px 16px; text-align:center; color:var(--muted); font-size:.86rem;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:18px; bottom:22px; z-index:25;
    width:58px; height:58px; border-radius:50%;
    background:linear-gradient(145deg,var(--accent),var(--accent-2));
    color:#fff; border:none; cursor:pointer;
    font-size:1.9rem; line-height:1; font-weight:300;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 26px rgba(192,91,51,.42);
    transition:transform .18s var(--ease), box-shadow .2s var(--ease);
    padding-bottom:3px;
  }
  .fab:active{transform:scale(.9);}

  footer{
    text-align:center; color:var(--muted);
    font-size:.72rem; margin:22px auto 8px; padding:0 20px;
  }
  footer .ver{opacity:.8; display:block; margin-top:4px;}

  /* ---------- Feuille modale ---------- */
  .backdrop{
    position:fixed; inset:0; z-index:40;
    background:rgba(15,22,15,.5);
    opacity:0; pointer-events:none;
    transition:opacity .28s var(--ease);
    backdrop-filter:blur(2px);
  }
  .backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    margin:0 auto; max-width:480px;
    background:var(--surface);
    border-radius:22px 22px 0 0;
    box-shadow:var(--shadow-lg);
    padding:8px 20px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(110%);
    transition:transform .34s var(--ease);
  }
  .sheet.open{transform:translateY(0);}
  .grabber{width:40px; height:4px; border-radius:4px; background:var(--line); margin:8px auto 14px;}
  .sheet h3{margin:0 0 4px; font-size:1.16rem; color:var(--forest-ink); font-family:'Iowan Old Style',Georgia,serif;}
  .sheet .field{margin-top:15px;}
  .sheet label{
    display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted); margin-bottom:6px;
  }
  .sheet input, .sheet select{
    width:100%; padding:13px 14px;
    border:1.5px solid var(--line); border-radius:12px;
    font-size:1rem; background:var(--surface-2); color:var(--ink);
    font-family:inherit; transition:border-color .2s var(--ease);
  }
  .sheet input:focus, .sheet select:focus{outline:none; border-color:var(--moss);}
  .sheet-actions{display:flex; gap:11px; margin-top:22px;}
  .sheet-actions button{
    flex:1; padding:14px; border-radius:12px; font-size:.95rem; font-weight:600;
    cursor:pointer; border:1px solid var(--line); font-family:inherit;
    transition:transform .14s var(--ease);
  }
  .sheet-actions button:active{transform:scale(.97);}
  .btn-cancel{background:var(--surface-2); color:var(--ink);}
  .btn-ok{background:var(--accent); color:#fff; border-color:var(--accent);}
  .sheet-del{
    display:none; width:100%; margin-top:14px; padding:11px;
    background:transparent; border:none; color:var(--accent);
    font-size:.86rem; cursor:pointer; font-family:inherit;
  }
  .sheet.editing .sheet-del{display:block;}

  /* ---------- Impression / PDF ---------- */
  .print-header{display:none;}
  @media print{
    @page{margin:13mm;}
    body{background:#fff; color:#000; padding:0;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    header, .tabs, .fab, footer, .backdrop, .sheet, .tools, .toggle-all{display:none !important;}
    .print-header{display:block; margin:0 0 12px;}
    .print-header h1{margin:0; font-size:20pt; color:#1E2F21;
      font-family:Georgia,serif;}
    .print-header .meta{font-size:9pt; color:#555; margin-top:2px;}
    main{max-width:none; padding:0;}
    .cat-card{break-inside:avoid; box-shadow:none; border:1px solid #999;
      margin-bottom:10px; animation:none; display:block !important;}
    .cat-ring{background:#eee !important;}
    .cat-ring::after{background:#fff !important;}
    .item{padding:5px 8px;}
    .item.checked{background:#E6ECDC !important;}
    .chk{border:2px solid #2F4A34 !important;}
    .item.checked .chk{background:#2F4A34 !important;}
    .item.checked .chk svg polyline{stroke-dashoffset:0 !important;}
  }
</style>
</head>
<body>

<header>
  <div class="head-top">
    <h1><span>🏕️</span> Checklist Vacances</h1>
    <div class="head-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Changer le thème">🌙</button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label">
      <span><b id="progressText">0 / 0</b> éléments prêts</span>
      <b id="progressPct">0%</b>
    </div>
  </div>
  <div class="mini-actions">
    <button class="chip-btn" id="pdfBtn">⭳ Exporter en PDF</button>
    <button class="chip-btn" id="resetBtn">↺ Tout décocher</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<div class="print-header">
  <h1>🏕️ Checklist Vacances — Camping en famille</h1>
  <div class="meta" id="printMeta"></div>
</div>

<main id="app"></main>

<button class="fab" id="fab" aria-label="Ajouter un élément">+</button>

<footer>
  Coché automatiquement sauvegardé sur cet appareil.
  <span class="ver" id="version"></span>
</footer>

<!-- Feuille modale (ajout / modification) -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grabber"></div>
  <h3 id="sheetTitle">Ajouter un élément</h3>
  <div class="field">
    <label for="fLabel">Nom de l'élément</label>
    <input type="text" id="fLabel" placeholder="Ex. Sac de couchage" autocomplete="off">
  </div>
  <div class="field">
    <label for="fCat">Catégorie</label>
    <select id="fCat"></select>
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="cancelBtn">Annuler</button>
    <button class="btn-ok" id="okBtn">Ajouter</button>
  </div>
  <button class="sheet-del" id="sheetDel">Supprimer cet élément</button>
</div>

<script>
const DATA = [
  ["Installation & structure", [
    "Tente raclette","Piquets","Tonnelle","Barre de toit","Sangles",
    "Cadenas remorque","Bâches","Cordes","Table","4 chaises","2 chaises camping",
    "2 transats","Table basse","Tapis (x2)",
    "Niveau à bulle (mise à niveau remorque)","Cales de roue"
  ]],
  ["Outillage", [
    "Marteau","Jeu de clés mixtes","Jeu de tournevis cliquet à embouts","Liquide de refroidissement"
  ]],
  ["Sanitaire", [
    "Toilette chimique","Produit toilette chimique","Brosse toilette",
    "Nécessaire de toilette, brosses à dents","Élastiques"
  ]],
  ["Électricité", [
    "Allonge enrouleur","Allonge (x2)","Multiprise (x2)",
    "Rallonge spécifique raccordement électrique camping",
    "Câble USB-C (x2)","Câble USB mini (x2)"
  ]],
  ["Cuisine", [
    "Bonbonne de gaz","Cuisinière à gaz","Briquet long","Couverts","Assiettes","Gobelets","Tasses",
    "Louche","Louche à pâtes","Spatule bois (x2)","Sous-plats (x2)","Planches (x2)","Tire-bouchon",
    "Bouchons verre à vin","Couvercles silicone","Plats (x3)","Tupperware (x5)","Ouvre-boîte",
    "Papier essuie-tout, sopalin","Produit vaisselle",
    "Verres à vin","Mugs","Cafetière italienne (moka)","Saladier / bol","Couteaux",
    "Huile d'olive","Sel / poivre / épices"
  ]],
  ["Rangement & linge", [
    "Étagère à mannes","4 mannes à linge","Étagère (à préciser)",
    "Armoire 3 compartiments (réserve nourriture)","Armoire 5 compartiments (vaisselle)",
    "Essuies (x2)","Torchons (x3)","Éponges (x4)","Balai","Épingles à linge","Sacs poubelle",
    "Raclette de sol","Pelle et balayette","Panier à linge / séchoir","Ciseaux",
    "Kit couture (aiguille, fil)","Marchepied"
  ]],
  ["Froid", [
    "Frigo box","Adaptateur frigo box","Glaçons refroidissants","Glaçons",
    "Réfrigérateur","Glacière électrique"
  ]],
  ["Confort", [
    "Ventilateurs (x2)","Lampe de poche / frontale"
  ]],
  ["Couchage / Literie", [
    "Matelas","Couettes","Oreillers","Draps housse","Doudous enfants","Bouchons d'oreilles"
  ]],
  ["Sacs & affaires personnelles", [
    "Sac à dos glacière","Sac à dos rando","Sac à dos normal","Sac de courses",
    "Sacs de vêtements (x4)","Vêtements roses (Oscar / Cédric / Wivine)","Colecons",
    "Chaussures (baskets, sandales, crocs)","Casquettes / chapeaux","Valise","Penderie (armoire toile)"
  ]],
  ["Papiers & argent", [
    "Carte d'identité / passeport","Carte européenne d'assurance maladie",
    "Attestation d'assurance camping / remorque","Espèces + carte bancaire",
    "Permis de conduire, carte grise remorque"
  ]],
  ["Pharmacie", [
    "Trousse de premiers secours","Médicaments habituels / ordonnances",
    "Crème solaire, après-soleil","Anti-moustique","Thermomètre, pansements"
  ]],
  ["Électronique", [
    "Chargeurs téléphone / GPS","Batterie externe","Appareil photo"
  ]],
  ["Enfant", [
    "Jeux / jouets, livres","Vélo + casque","Brassards ou gilet si baignade",
    "Poupée","Ballon","Jeu de société"
  ]]
];
const ICONS = ["⛺","🔧","🚿","🔌","🍳","🧺","❄️","🌬️","🛏️","🎒","📄","💊","🔋","🧸"];

const VERSION = "2.0";
const VERSION_DATE = "25/07/2026";
const KEY = "checklist_vacances_v1";

/* ---------- Persistance ---------- */
function load(k, def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } }
let state    = load(KEY, {});
let customs  = load(KEY+"_custom", []);   // [{id, cat, label}]
let overrides= load(KEY+"_over", {});     // {clé: libellé}
let removed  = load(KEY+"_removed", []);  // [clé]
let activeTab = parseInt(localStorage.getItem(KEY+"_tab") || "0", 10);
if(isNaN(activeTab) || activeTab < 0 || activeTab >= DATA.length) activeTab = 0;

const save = (k,v)=> localStorage.setItem(k, JSON.stringify(v));
const saveState    = ()=> save(KEY, state);
const saveCustoms  = ()=> save(KEY+"_custom", customs);
const saveOverrides= ()=> save(KEY+"_over", overrides);
const saveRemoved  = ()=> save(KEY+"_removed", removed);

/* ---------- Thème ---------- */
const themeBtn = document.getElementById("themeBtn");
function effectiveTheme(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t) return t;
  return window.matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
}
function applyTheme(){
  const saved = localStorage.getItem(KEY+"_theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  themeBtn.textContent = effectiveTheme() === "dark" ? "☀️" : "🌙";
}
themeBtn.addEventListener("click", ()=>{
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(KEY+"_theme", next);
  themeBtn.textContent = next === "dark" ? "☀️" : "🌙";
});
applyTheme();

/* ---------- Données fusionnées ---------- */
function getItems(ci){
  const list = [];
  DATA[ci][1].forEach((label, ii)=>{
    const key = "c"+ci+"_i"+ii;
    if(removed.indexOf(key) !== -1) return;
    list.push({ key, label: overrides[key] || label, custom:false });
  });
  customs.forEach(it=>{
    if(it.cat === ci) list.push({ key:"custom_"+it.id, label:it.label, custom:true, id:it.id });
  });
  return list;
}
const countCat = (ci)=>{
  const items = getItems(ci);
  const done = items.filter(it=>state[it.key]).length;
  return { done, total: items.length };
};

const app  = document.getElementById("app");
const tabsEl = document.getElementById("tabs");

/* ---------- Rendu ---------- */
function checkSvg(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
}

function renderTabs(){
  tabsEl.innerHTML = "";
  DATA.forEach((cat, ci)=>{
    const {done, total} = countCat(ci);
    const complete = total > 0 && done === total;
    const tab = document.createElement("button");
    tab.className = "tab" + (ci===activeTab?" active":"") + (complete?" complete":"");
    tab.dataset.ci = ci;

    const ico = document.createElement("span"); ico.className="t-ico"; ico.textContent = ICONS[ci]||"•";
    const name = document.createElement("span"); name.textContent = cat[0];
    const cnt = document.createElement("span"); cnt.className="t-count"; cnt.textContent = done+"/"+total;
    tab.append(ico, name, cnt);

    tab.addEventListener("click", ()=>{
      if(ci === activeTab) return;
      activeTab = ci;
      localStorage.setItem(KEY+"_tab", ci);
      renderTabs();
      renderContent();
      window.scrollTo({top:0, behavior:"smooth"});
    });
    tabsEl.appendChild(tab);
  });
}

function renderContent(){
  const ci = activeTab;
  const items = getItems(ci);
  const {done, total} = countCat(ci);
  app.innerHTML = "";

  const card = document.createElement("div"); card.className = "cat-card";

  // En-tête catégorie
  const head = document.createElement("div"); head.className = "cat-head";
  const ring = document.createElement("div"); ring.className = "cat-ring"; ring.id = "catRing";
  ring.style.setProperty("--p", total ? Math.round(done/total*100) : 0);
  ring.innerHTML = '<span class="ring-ico">'+(ICONS[ci]||"•")+'</span>';
  const ct = document.createElement("div"); ct.className = "ct";
  const h2 = document.createElement("h2"); h2.textContent = DATA[ci][0];
  const sub = document.createElement("div"); sub.className = "sub"; sub.id = "catSub";
  sub.textContent = done + " sur " + total + " coché" + (done>1?"s":"");
  ct.append(h2, sub);
  const allBtn = document.createElement("button"); allBtn.className = "toggle-all"; allBtn.id = "catAll";
  const allDone = total>0 && done===total;
  allBtn.textContent = allDone ? "Tout décocher" : "Tout cocher";
  allBtn.addEventListener("click", ()=>{
    const target = !allDone;
    items.forEach(it=> state[it.key] = target);
    saveState(); renderTabs(); renderContent();
  });
  head.append(ring, ct, allBtn);
  card.appendChild(head);

  // Liste
  if(items.length === 0){
    const e = document.createElement("div"); e.className="empty";
    e.textContent = "Aucun élément dans cette catégorie.";
    card.appendChild(e);
  }else{
    const ul = document.createElement("ul"); ul.className = "items";
    items.forEach(it=> ul.appendChild(buildRow(it, ci)));
    card.appendChild(ul);
  }

  app.appendChild(card);
}

function buildRow(it, ci){
  const li = document.createElement("li");
  li.className = "item" + (state[it.key] ? " checked" : "");

  const chk = document.createElement("div"); chk.className = "chk"; chk.innerHTML = checkSvg();
  const lbl = document.createElement("div"); lbl.className = "lbl"; lbl.textContent = it.label;

  const tools = document.createElement("div"); tools.className = "tools";
  const edit = document.createElement("button"); edit.className="t-btn edit"; edit.textContent="✎";
  edit.setAttribute("aria-label","Modifier");
  edit.addEventListener("click", e=>{ e.stopPropagation(); openEdit(it, ci); });
  const del = document.createElement("button"); del.className="t-btn del"; del.textContent="✕";
  del.setAttribute("aria-label","Supprimer");
  del.addEventListener("click", e=>{ e.stopPropagation(); deleteItem(it, true); });
  tools.append(edit, del);

  li.append(chk, lbl, tools);
  li.addEventListener("click", ()=>{
    state[it.key] = !state[it.key];
    saveState();
    li.classList.toggle("checked", !!state[it.key]);
    refreshCounts();
  });
  return li;
}

/* Mise à jour légère des compteurs (sans reconstruire, pour la fluidité) */
function refreshCounts(){
  let done=0, total=0;
  DATA.forEach((_,ci)=>{ const c=countCat(ci); done+=c.done; total+=c.total; });
  document.getElementById("progressText").textContent = done + " / " + total;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("progressFill").style.width = pct + "%";

  tabsEl.querySelectorAll(".tab").forEach(tab=>{
    const ci = +tab.dataset.ci;
    const c = countCat(ci);
    const comp = c.total>0 && c.done===c.total;
    tab.querySelector(".t-count").textContent = c.done+"/"+c.total;
    tab.classList.toggle("complete", comp);
  });

  const c = countCat(activeTab);
  const ring = document.getElementById("catRing");
  if(ring) ring.style.setProperty("--p", c.total ? Math.round(c.done/c.total*100) : 0);
  const sub = document.getElementById("catSub");
  if(sub) sub.textContent = c.done + " sur " + c.total + " coché" + (c.done>1?"s":"");
  const allBtn = document.getElementById("catAll");
  if(allBtn) allBtn.textContent = (c.total>0 && c.done===c.total) ? "Tout décocher" : "Tout cocher";
}

function render(){ renderTabs(); renderContent(); refreshCounts(); }

/* ---------- Actions globales ---------- */
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("Tout décocher ?")){ state = {}; saveState(); render(); }
});
document.getElementById("pdfBtn").addEventListener("click", ()=>{
  const d = new Date();
  document.getElementById("printMeta").textContent =
    "Édité le " + d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  // Rendre toutes les catégories visibles pour l'impression
  const cards = buildAllForPrint();
  app.appendChild(cards);
  window.print();
  cards.remove();
});

// Construit un bloc contenant toutes les catégories (impression uniquement)
function buildAllForPrint(){
  const frag = document.createElement("div");
  frag.id = "printAll";
  DATA.forEach((cat, ci)=>{
    if(ci === activeTab) return; // déjà affichée à l'écran
    const items = getItems(ci);
    const card = document.createElement("div"); card.className="cat-card";
    const head = document.createElement("div"); head.className="cat-head";
    const ring = document.createElement("div"); ring.className="cat-ring";
    const c = countCat(ci);
    ring.style.setProperty("--p", c.total?Math.round(c.done/c.total*100):0);
    ring.innerHTML = '<span class="ring-ico">'+(ICONS[ci]||"•")+'</span>';
    const ct = document.createElement("div"); ct.className="ct";
    const h2 = document.createElement("h2"); h2.textContent = cat[0];
    ct.appendChild(h2);
    head.append(ring, ct); card.appendChild(head);
    const ul = document.createElement("ul"); ul.className="items";
    items.forEach(it=>{
      const li = document.createElement("li"); li.className="item"+(state[it.key]?" checked":"");
      const chk = document.createElement("div"); chk.className="chk"; chk.innerHTML=checkSvg();
      const lbl = document.createElement("div"); lbl.className="lbl"; lbl.textContent=it.label;
      li.append(chk,lbl); ul.appendChild(li);
    });
    card.appendChild(ul); frag.appendChild(card);
  });
  return frag;
}

/* ---------- Suppression ---------- */
function deleteItem(it, ask){
  if(ask && !confirm("Supprimer « " + it.label + " » ?")) return;
  if(it.custom){
    customs = customs.filter(x=>x.id !== it.id); saveCustoms();
  }else{
    if(removed.indexOf(it.key) === -1){ removed.push(it.key); saveRemoved(); }
    if(overrides[it.key]){ delete overrides[it.key]; saveOverrides(); }
  }
  delete state[it.key]; saveState();
  render();
}

/* ---------- Feuille modale ---------- */
const backdrop = document.getElementById("backdrop");
const sheet    = document.getElementById("sheet");
const fLabel   = document.getElementById("fLabel");
const fCat     = document.getElementById("fCat");
const sheetTitle = document.getElementById("sheetTitle");
const okBtn    = document.getElementById("okBtn");
const sheetDel = document.getElementById("sheetDel");
let mode = "add", editRef = null;

function fillCats(sel){
  fCat.innerHTML = "";
  DATA.forEach((cat,ci)=>{
    const o=document.createElement("option"); o.value=ci; o.textContent=(ICONS[ci]||"")+" "+cat[0];
    fCat.appendChild(o);
  });
  fCat.value = sel;
}
function openSheet(){ backdrop.classList.add("open"); sheet.classList.add("open"); setTimeout(()=>{fLabel.focus();},120); }
function closeSheet(){ backdrop.classList.remove("open"); sheet.classList.remove("open"); }

function openAdd(){
  mode="add"; editRef=null;
  sheet.classList.remove("editing");
  sheetTitle.textContent = "Ajouter un élément";
  okBtn.textContent = "Ajouter";
  fillCats(activeTab); fLabel.value = "";
  openSheet();
}
function openEdit(it, ci){
  mode="edit"; editRef={ custom:it.custom, key:it.key, ci, id:it.id };
  sheet.classList.add("editing");
  sheetTitle.textContent = "Modifier l'élément";
  okBtn.textContent = "Enregistrer";
  fillCats(ci); fLabel.value = it.label;
  openSheet(); setTimeout(()=>fLabel.select(),140);
}
function confirmSheet(){
  const label = fLabel.value.trim();
  if(!label){ fLabel.focus(); return; }
  const ci = parseInt(fCat.value,10);
  const newId = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  if(mode==="add"){
    customs.push({ id:newId(), cat:ci, label }); saveCustoms();
  }else if(editRef.custom){
    const it = customs.find(x=>x.id===editRef.id);
    if(it){ it.label=label; it.cat=ci; saveCustoms(); }
  }else if(ci === editRef.ci){
    overrides[editRef.key] = label; saveOverrides();
  }else{
    if(removed.indexOf(editRef.key)===-1){ removed.push(editRef.key); saveRemoved(); }
    if(overrides[editRef.key]){ delete overrides[editRef.key]; saveOverrides(); }
    const id = newId(); customs.push({ id, cat:ci, label }); saveCustoms();
    if(state[editRef.key]){ state["custom_"+id] = true; }
    delete state[editRef.key];
  }
  saveState();
  activeTab = ci; localStorage.setItem(KEY+"_tab", ci);
  closeSheet(); render();
}

document.getElementById("fab").addEventListener("click", openAdd);
document.getElementById("cancelBtn").addEventListener("click", closeSheet);
okBtn.addEventListener("click", confirmSheet);
backdrop.addEventListener("click", closeSheet);
fLabel.addEventListener("keydown", e=>{ if(e.key==="Enter") confirmSheet(); });
sheetDel.addEventListener("click", ()=>{
  if(!editRef) return;
  const it = editRef.custom
    ? { custom:true, id:editRef.id, key:editRef.key, label:fLabel.value }
    : { custom:false, key:editRef.key, label:fLabel.value };
  if(confirm("Supprimer « " + fLabel.value + " » ?")){ closeSheet(); deleteItem(it, false); }
});

document.getElementById("version").textContent = "Version " + VERSION + " — " + VERSION_DATE;
render();
</script>
</body>
</html>
