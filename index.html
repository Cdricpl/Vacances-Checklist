<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#FBF6EA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checklist">
<title>Checklist Vacances</title>
<style>
  :root{
    --ease:cubic-bezier(.4,0,.2,1);
    --hand:'Bradley Hand','Segoe Print','Comic Sans MS','Chalkboard SE','Marker Felt',cursive;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

    --paper:#FBF6EA;
    --paper-2:#F4EDDD;
    --card:#FFFFFF;
    --ink:#3A3A38;
    --ink-soft:#7C766A;
    --line:#E7DFCC;
    --shadow:0 2px 3px rgba(90,75,45,.06), 0 10px 26px rgba(90,75,45,.10);
    --shadow-lg:0 20px 60px rgba(60,45,20,.30);
    --tape:rgba(255,255,255,.62);
    --row:#FFFFFF;
    --row-done:rgba(255,255,255,.45);
    --tick:#FFFFFF;
    --dash:rgba(0,0,0,.10);
  }
  :root[data-theme="dark"]{
    --paper:#191A1D;
    --paper-2:#1F2126;
    --card:#25272C;
    --ink:#EDE8DC;
    --ink-soft:#9C978A;
    --line:#33363D;
    --shadow:0 2px 3px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.45);
    --shadow-lg:0 20px 60px rgba(0,0,0,.7);
    --tape:rgba(255,255,255,.10);
    --row:#2C3036;
    --row-done:rgba(0,0,0,.30);
    --tick:#1A1C20;
    --dash:rgba(255,255,255,.16);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#191A1D; --paper-2:#1F2126; --card:#25272C;
      --ink:#EDE8DC; --ink-soft:#9C978A; --line:#33363D;
      --shadow:0 2px 3px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.45);
      --shadow-lg:0 20px 60px rgba(0,0,0,.7);
      --tape:rgba(255,255,255,.10);
      --row:#2C3036;
      --row-done:rgba(0,0,0,.30);
      --tick:#1A1C20;
      --dash:rgba(255,255,255,.16);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 12% 4%, rgba(168,224,197,.22), transparent 34%),
      radial-gradient(circle at 88% 12%, rgba(249,190,180,.20), transparent 32%),
      radial-gradient(circle at 50% 96%, rgba(185,199,242,.18), transparent 38%);
    background-attachment:fixed;
    min-height:100vh;
    padding-bottom:98px;
    transition:background-color .3s var(--ease), color .3s var(--ease);
  }

  /* ================= En-tête affiche ================= */
  header{
    position:relative;
    text-align:center;
    padding:22px 18px 16px;
  }
  .doodle{position:absolute; font-size:1.5rem; opacity:.85; user-select:none;}
  .doodle.l{left:16px; top:24px; transform:rotate(-14deg);}
  .doodle.r{right:16px; top:24px; transform:rotate(14deg);}

  h1.title{
    margin:0; line-height:1.02;
    font-family:var(--hand);
    font-weight:400;
  }
  h1.title .l1{
    display:block; font-size:2.05rem; color:var(--ink);
    letter-spacing:.5px;
  }
  h1.title .l2{
    display:block; font-size:1.62rem; font-weight:700;
    color:#2E8B74; margin-top:-2px;
  }
  :root[data-theme="dark"] h1.title .l2{color:#7FD9BE;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1.title .l2{color:#7FD9BE;}}
  .squiggle{display:block; margin:6px auto 0; width:180px; height:9px; opacity:.55;}
  .tagline{
    font-family:var(--hand);
    font-size:.94rem; color:var(--ink-soft); margin-top:8px;
  }

  /* ---- Jauge globale ---- */
  .gauge{
    max-width:520px; margin:16px auto 0; padding:0 20px;
  }
  .gauge-track{
    height:14px; border-radius:20px;
    background:var(--paper-2);
    border:1.5px solid var(--line);
    overflow:hidden; padding:2px;
  }
  .gauge-fill{
    height:100%; width:0%; border-radius:20px;
    background:linear-gradient(90deg,#7FD3B2,#F2B49F,#B9C7F2);
    transition:width .55s var(--ease);
  }
  .gauge-txt{
    font-family:var(--hand); font-size:1rem;
    margin-top:7px; color:var(--ink-soft);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .gauge-txt b{color:var(--ink); font-weight:700;}

  .tools-row{
    display:flex; gap:9px; justify-content:center; flex-wrap:wrap;
    margin:14px auto 0; padding:0 16px; max-width:520px;
  }
  .tool-btn{
    font-family:var(--body); font-size:.78rem; font-weight:600;
    background:var(--card); color:var(--ink);
    border:1.5px solid var(--line);
    padding:9px 15px; border-radius:24px; cursor:pointer;
    box-shadow:0 2px 0 var(--line);
    transition:transform .14s var(--ease), box-shadow .14s var(--ease);
  }
  .tool-btn:active{transform:translateY(2px); box-shadow:none;}

  /* ================= Onglets pastel ================= */
  .tabs{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    padding:18px 14px 6px; max-width:640px; margin:0 auto;
  }
  .tab{
    --c:#DDD; --d:#666;
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--body); font-size:.78rem; font-weight:600;
    white-space:nowrap; cursor:pointer;
    background:var(--card); color:var(--ink);
    border:2px solid var(--c);
    padding:8px 13px; border-radius:24px;
    transition:transform .14s var(--ease), background .22s var(--ease), color .2s var(--ease);
  }
  .tab:active{transform:scale(.94);}
  .tab .t-ico{font-size:.98rem; line-height:1;}
  .tab .t-count{
    font-size:.68rem; font-weight:700; color:var(--d);
    background:var(--c); padding:2px 8px; border-radius:12px;
  }
  .tab.active{background:var(--c); color:var(--d); border-color:var(--d);}
  .tab.active .t-count{background:var(--d); color:#fff;}
  .tab.done{position:relative;}
  .tab.done::after{
    content:"✓"; font-size:.7rem; font-weight:800; color:var(--d);
    margin-left:-2px;
  }
  :root[data-theme="dark"] .tab{background:var(--card); color:var(--ink);}
  :root[data-theme="dark"] .tab .t-count{color:#1B1C20;}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .tab .t-count{color:#1B1C20;}
  }

  /* ================= Carte catégorie (post-it) ================= */
  main{max-width:560px; margin:0 auto; padding:12px 16px 0;}

  .cat{
    --c:#DDD; --d:#666;
    --catbg:var(--c);
    --acc:var(--d);
    position:relative;
    background:var(--catbg);
    border-radius:6px;
    padding:26px 16px 18px;
    box-shadow:var(--shadow);
    transform:rotate(-.55deg);
    animation:pop .34s var(--ease);
  }
  @keyframes pop{from{opacity:0; transform:rotate(-.55deg) translateY(14px) scale(.985);}
                 to{opacity:1; transform:rotate(-.55deg) translateY(0) scale(1);}}
  /* scotch */
  .cat::before{
    content:""; position:absolute; top:-11px; left:50%;
    transform:translateX(-50%) rotate(-1.6deg);
    width:104px; height:24px;
    background:var(--tape);
    border-left:1px dashed rgba(0,0,0,.07);
    border-right:1px dashed rgba(0,0,0,.07);
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  /* hachures déco */
  .cat::after{
    content:""; position:absolute; top:12px; right:12px;
    width:46px; height:20px; opacity:.35;
    background:repeating-linear-gradient(115deg, var(--acc) 0 1.5px, transparent 1.5px 6px);
  }
  :root[data-theme="dark"] .cat{
    --catbg:color-mix(in srgb, var(--c) 15%, #1F2126);
    --acc:var(--c);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .cat{
      --catbg:color-mix(in srgb, var(--c) 15%, #1F2126);
      --acc:var(--c);
    }
  }

  .cat-top{
    display:flex; align-items:flex-start; gap:11px;
    padding:0 2px 12px;
    border-bottom:2px dashed var(--dash);
    margin-bottom:12px;
  }
  .cat-ico{font-size:1.5rem; line-height:1.1; flex-shrink:0;}
  .cat-tt{flex:1; min-width:0;}
  .cat-tt h2{
    margin:0; font-family:var(--hand); font-weight:700;
    font-size:1.34rem; color:var(--acc); line-height:1.14;
    letter-spacing:.3px;
  }
  .cat-tt .cnt{
    font-family:var(--hand); font-size:.92rem;
    color:var(--acc); opacity:.78; margin-top:2px;
  }
  .all-btn{
    flex-shrink:0; align-self:center;
    font-family:var(--body); font-size:.7rem; font-weight:700;
    background:var(--row); color:var(--acc);
    border:1.5px solid var(--acc);
    padding:6px 11px; border-radius:20px; cursor:pointer;
    transition:transform .14s var(--ease);
  }
  .all-btn:active{transform:scale(.92);}

  .items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px;}
  .item{
    display:flex; align-items:center; gap:11px;
    background:var(--row);
    border-radius:22px;
    padding:10px 8px 10px 13px;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
    transition:transform .14s var(--ease), background .25s var(--ease), opacity .25s var(--ease);
  }
  .item:active{transform:scale(.985);}
  .item.checked{background:var(--row-done); opacity:.78;}

  .box{
    width:21px; height:21px; min-width:21px;
    border:2.5px solid var(--acc); border-radius:5px;
    background:var(--row);
    color:var(--tick);
    display:flex; align-items:center; justify-content:center;
    transition:background .22s var(--ease);
  }
  .item.checked .box{background:var(--acc);}
  .box svg{width:14px; height:14px;}
  .box svg polyline{
    stroke-dasharray:24; stroke-dashoffset:24;
    transition:stroke-dashoffset .3s var(--ease) .03s;
  }
  .item.checked .box svg polyline{stroke-dashoffset:0;}

  .lbl{
    flex:1; min-width:0; font-size:.95rem; line-height:1.3;
    word-break:break-word;
    transition:color .25s var(--ease);
  }
  .item.checked .lbl{
    text-decoration:line-through; text-decoration-color:var(--acc);
    color:var(--ink-soft);
  }
  .tools{display:flex; gap:0; flex-shrink:0;}
  .t-btn{
    width:31px; height:31px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--ink-soft);
    font-size:.92rem; cursor:pointer;
    transition:transform .14s var(--ease), background .2s var(--ease);
  }
  .t-btn:active{transform:scale(.84); background:rgba(0,0,0,.06);}

  .empty{
    font-family:var(--hand); font-size:1rem;
    text-align:center; color:var(--acc); opacity:.75; padding:20px 8px;
  }

  /* ================= FAB ================= */
  .fab{
    position:fixed; right:18px; bottom:22px; z-index:25;
    height:52px; padding:0 20px 2px; border-radius:26px;
    background:#2E8B74; color:#fff; border:none; cursor:pointer;
    font-family:var(--body); font-size:.9rem; font-weight:700;
    display:flex; align-items:center; gap:7px;
    box-shadow:0 8px 22px rgba(46,139,116,.42);
    transition:transform .16s var(--ease);
  }
  .fab span.p{font-size:1.35rem; font-weight:400; line-height:1;}
  .fab:active{transform:scale(.93);}

  footer{
    text-align:center; color:var(--ink-soft);
    font-family:var(--hand); font-size:.9rem;
    margin:26px auto 10px; padding:0 20px;
  }
  footer .ver{display:block; font-family:var(--body); font-size:.68rem; opacity:.75; margin-top:5px;}

  /* ================= Feuille modale ================= */
  .backdrop{
    position:fixed; inset:0; z-index:40;
    background:rgba(40,32,18,.46); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .28s var(--ease);
  }
  .backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    margin:0 auto; max-width:460px;
    background:var(--paper);
    border-radius:24px 24px 0 0;
    box-shadow:var(--shadow-lg);
    padding:8px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(110%); transition:transform .34s var(--ease);
  }
  .sheet.open{transform:translateY(0);}
  .grab{width:42px; height:4px; border-radius:4px; background:var(--line); margin:8px auto 14px;}
  .sheet h3{
    margin:0; font-family:var(--hand); font-weight:700;
    font-size:1.35rem; color:var(--ink);
  }
  .field{margin-top:15px;}
  .field label{
    display:block; font-size:.71rem; font-weight:700;
    text-transform:uppercase; letter-spacing:.6px;
    color:var(--ink-soft); margin-bottom:6px;
  }
  .field input, .field select{
    width:100%; padding:13px 14px;
    border:2px solid var(--line); border-radius:14px;
    font-size:1rem; background:var(--card); color:var(--ink);
    font-family:inherit; transition:border-color .2s var(--ease);
  }
  .field input:focus, .field select:focus{outline:none; border-color:#2E8B74;}
  .sheet-actions{display:flex; gap:11px; margin-top:20px;}
  .sheet-actions button{
    flex:1; padding:14px; border-radius:26px;
    font-size:.94rem; font-weight:700; font-family:inherit;
    cursor:pointer; border:2px solid var(--line);
    transition:transform .14s var(--ease);
  }
  .sheet-actions button:active{transform:scale(.96);}
  .btn-cancel{background:var(--card); color:var(--ink);}
  .btn-ok{background:#2E8B74; color:#fff; border-color:#2E8B74;}
  .sheet-del{
    display:none; width:100%; margin-top:12px; padding:11px;
    background:none; border:none; color:#C0553F;
    font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .sheet.editing .sheet-del{display:block;}

  /* ================= Impression ================= */
  .print-header{display:none;}
  @media print{
    @page{margin:12mm;}
    body{background:#fff !important; background-image:none !important;
      color:#000; padding:0;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    header, .tabs, .fab, footer, .backdrop, .sheet, .tools, .all-btn, .gauge, .tools-row{display:none !important;}
    .print-header{display:block; text-align:center; margin:0 0 14px;}
    .print-header h1{margin:0; font-family:var(--hand); font-size:22pt; color:#2E8B74;}
    .print-header .meta{font-size:8.5pt; color:#666; margin-top:3px; font-family:var(--body);}
    main{max-width:none; padding:0;}
    .cat{
      break-inside:avoid; transform:none; animation:none;
      box-shadow:none; border:1.5px solid #bbb;
      margin-bottom:9px; padding:12px 12px 10px;
    }
    .cat::before, .cat::after{display:none;}
    .items{gap:3px;}
    .item{padding:4px 8px; box-shadow:none; background:#fff !important;}
    .item.checked{opacity:1;}
    .box{border:2px solid #444 !important;}
    .item.checked .box{background:#444 !important;}
    .item.checked .box svg polyline{stroke-dashoffset:0 !important;}
  }

  @media (min-width:640px){
    h1.title .l1{font-size:2.4rem;}
    h1.title .l2{font-size:1.9rem;}
  }
</style>
</head>
<body>

<header>
  <span class="doodle l">🦀</span>
  <span class="doodle r">🌴</span>
  <h1 class="title">
    <span class="l1">Check-list</span>
    <span class="l2">des vacances</span>
  </h1>
  <svg class="squiggle" viewBox="0 0 180 9" fill="none" aria-hidden="true">
    <path d="M2 6C22 2 38 8 58 5s34-5 54-1 32 6 52 2" stroke="#2E8B74" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <div class="tagline">Camping en famille — à cocher avant le départ 🏕️</div>

  <div class="gauge">
    <div class="gauge-track"><div class="gauge-fill" id="gaugeFill"></div></div>
    <div class="gauge-txt">
      <span><b id="gTxt">0 / 0</b> dans les valises</span>
      <b id="gPct">0%</b>
    </div>
  </div>

  <div class="tools-row">
    <button class="tool-btn" id="pdfBtn">⭳ Exporter en PDF</button>
    <button class="tool-btn" id="resetBtn">↺ Tout décocher</button>
    <button class="tool-btn" id="themeBtn" aria-label="Changer le thème">🌙</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<div class="print-header">
  <h1>Check-list des vacances</h1>
  <div class="meta" id="printMeta"></div>
</div>

<main id="app"></main>

<button class="fab" id="fab"><span class="p">+</span> Ajouter</button>

<footer>
  Coché automatiquement sauvegardé sur cet appareil ✓
  <span class="ver" id="version"></span>
</footer>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="sheetTitle">Ajouter un élément</h3>
  <div class="field">
    <label for="fLabel">Nom de l'élément</label>
    <input type="text" id="fLabel" placeholder="Ex. Sac de couchage" autocomplete="off">
  </div>
  <div class="field">
    <label for="fCat">Catégorie</label>
    <select id="fCat"></select>
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="cancelBtn">Annuler</button>
    <button class="btn-ok" id="okBtn">Ajouter</button>
  </div>
  <button class="sheet-del" id="sheetDel">Supprimer cet élément</button>
</div>

    "Guirlande lumineuse"
  ]],
  ["Sacs & affaires personnelles", [
    "Sac à dos glacière","Sac à dos rando","Sac à dos normal",
    "Sac de courses","Sacs de vêtements (x4)","Vêtements roses (Oscar / Cédric / Wivine)",
    "Colecons","Chaussures (baskets, sandales, crocs)","Casquettes / chapeaux",
    "Valise","Penderie (armoire toile)","Maillots de bain",
    "Serviettes de plage","Vêtements de pluie (K-way, bottes)"
  ]],
  ["Papiers & argent", [
    "Carte d'identité / passeport","Carte européenne d'assurance maladie","Attestation d'assurance camping / remorque",
    "Espèces + carte bancaire","Permis de conduire, carte grise remorque"
  ]],
  ["Enfant & loisirs", [
    "Jeux / jouets, livres","Vélo + casque","Brassards ou gilet si baignade",
    "Poupée","Ballon","Jeu de société",
    "Pétanque / badminton / frisbee"
  ]]
];

/* icône + couleur pastel + couleur foncée, par catégorie */
const STYLE = [
  ["⛺","#A8E0C5","#1F6B52"],
  ["🔧","#AFD9F2","#175F86"],
  ["🚿","#D0BFF2","#5B3F9C"],
  ["🔌","#F7E39A","#856107"],
  ["🍳","#F9BEB4","#A8402F"],
  ["🧺","#FBD3A6","#96590F"],
  ["🛏️","#B9C7F2","#36479B"],
  ["🎒","#CBE7A4","#4E7420"],
  ["📄","#EBD9AE","#7A5A1E"],
  ["🧸","#FBDA8B","#96690A"]
];

const VERSION = "3.9";
const VERSION_DATE = "26/07/2026";
const KEY = "checklist_vacances_v1";

/* ---------- Persistance ---------- */
function load(k, def){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? def; }catch(e){ return def; } }
let state     = load(KEY, {});
let customs   = load(KEY+"_custom", []);
let overrides = load(KEY+"_over", {});
let removed   = load(KEY+"_removed", []);
let activeTab = parseInt(localStorage.getItem(KEY+"_tab") || "0", 10);
if(isNaN(activeTab)) activeTab = 0;   // borné après la migration ci-dessous

const save = (k,v)=> localStorage.setItem(k, JSON.stringify(v));
const saveState     = ()=> save(KEY, state);
const saveCustoms   = ()=> save(KEY+"_custom", customs);
const saveOverrides = ()=> save(KEY+"_over", overrides);
const saveRemoved   = ()=> save(KEY+"_removed", removed);

/* ---------- Migration : regroupement des catégories (15 -> 10) ----------
   Les clés de sauvegarde sont indexées par position (c<catégorie>_i<élément>).
   Le regroupement déplace les éléments, il faut donc reporter les coches,
   renommages et suppressions sur les nouvelles positions.
   MIG : ancien index de catégorie -> [nouvel index, décalage des éléments]  */
const MIG = {0:[0,0], 1:[1,0], 2:[2,0], 3:[3,0], 4:[4,0], 5:[5,0], 6:[4,41], 7:[6,6],
             8:[6,0], 9:[7,0], 10:[8,0], 11:[2,11], 12:[3,6], 13:[9,0], 14:[1,4]};

(function migrate(){
  if(localStorage.getItem(KEY+"_schema") === "2") return;
  const remap = k=>{
    const m = /^c(\d+)_i(\d+)$/.exec(k);
    if(!m) return k;                       // les clés custom_ ne bougent pas
    const t = MIG[+m[1]];
    return t ? "c"+t[0]+"_i"+(t[1] + (+m[2])) : k;
  };
  const ns = {}; for(const k in state)     ns[remap(k)] = state[k];
  const no = {}; for(const k in overrides) no[remap(k)] = overrides[k];
  state = ns;
  overrides = no;
  removed = removed.map(remap);
  customs = customs.map(it => MIG[it.cat] ? Object.assign({}, it, {cat: MIG[it.cat][0]}) : it);
  if(MIG[activeTab]) activeTab = MIG[activeTab][0];
  if(activeTab < 0 || activeTab >= DATA.length) activeTab = 0;

  saveState(); saveOverrides(); saveRemoved(); saveCustoms();
  localStorage.setItem(KEY+"_tab", activeTab);
  localStorage.setItem(KEY+"_schema", "2");
})();

if(activeTab < 0 || activeTab >= DATA.length) activeTab = 0;

/* ---------- Thème ---------- */
const themeBtn = document.getElementById("themeBtn");
function effectiveTheme(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t) return t;
  return window.matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
}
(function initTheme(){
  const saved = localStorage.getItem(KEY+"_theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  themeBtn.textContent = effectiveTheme()==="dark" ? "☀️" : "🌙";
})();
themeBtn.addEventListener("click", ()=>{
  const next = effectiveTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(KEY+"_theme", next);
  themeBtn.textContent = next==="dark" ? "☀️" : "🌙";
});

/* ---------- Données fusionnées ---------- */
function getItems(ci){
  const list = [];
  DATA[ci][1].forEach((label, ii)=>{
    const key = "c"+ci+"_i"+ii;
    if(removed.indexOf(key) !== -1) return;
    list.push({ key, label: overrides[key] || label, custom:false });
  });
  customs.forEach(it=>{
    if(it.cat === ci) list.push({ key:"custom_"+it.id, label:it.label, custom:true, id:it.id });
  });
  /* Tri alphabétique à l'affichage uniquement : les clés de sauvegarde
     restent liées à la position d'origine dans DATA, donc les coches ne
     bougent pas. « numeric » range « 2 transats » avant « 4 chaises ». */
  list.sort((a,b)=> a.label.localeCompare(b.label, "fr", {sensitivity:"base", numeric:true}));
  return list;
}
function countCat(ci){
  const items = getItems(ci);
  return { done: items.filter(it=>state[it.key]).length, total: items.length };
}

const app    = document.getElementById("app");
const tabsEl = document.getElementById("tabs");
const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

/* ---------- Onglets ---------- */
function renderTabs(){
  tabsEl.innerHTML = "";
  DATA.forEach((cat, ci)=>{
    const [ico, pastel, deep] = STYLE[ci] || ["•","#DDD","#666"];
    const {done, total} = countCat(ci);
    const tab = document.createElement("button");
    tab.className = "tab" + (ci===activeTab?" active":"") + (total>0 && done===total ? " done" : "");
    tab.dataset.ci = ci;
    tab.style.setProperty("--c", pastel);
    tab.style.setProperty("--d", deep);

    const i = document.createElement("span"); i.className="t-ico"; i.textContent=ico;
    const n = document.createElement("span"); n.textContent=cat[0];
    const c = document.createElement("span"); c.className="t-count"; c.textContent=done+"/"+total;
    tab.append(i, n, c);

    tab.addEventListener("click", ()=>{
      if(ci === activeTab) return;
      activeTab = ci;
      localStorage.setItem(KEY+"_tab", ci);
      renderTabs(); renderContent();
      window.scrollTo({ top: tabsEl.offsetTop - 8, behavior:"smooth" });
    });
    tabsEl.appendChild(tab);
  });
}

/* ---------- Carte catégorie ---------- */
function renderContent(){
  const ci = activeTab;
  app.innerHTML = "";
  app.appendChild(buildCard(ci, true));
}

function buildCard(ci, interactive){
  const [ico, pastel, deep] = STYLE[ci] || ["•","#DDD","#666"];
  const items = getItems(ci);
  const {done, total} = countCat(ci);

  const card = document.createElement("section");
  card.className = "cat";
  card.style.setProperty("--c", pastel);
  card.style.setProperty("--d", deep);

  const top = document.createElement("div"); top.className="cat-top";
  const ic = document.createElement("div"); ic.className="cat-ico"; ic.textContent=ico;
  const tt = document.createElement("div"); tt.className="cat-tt";
  const h2 = document.createElement("h2"); h2.textContent = DATA[ci][0];
  const cnt = document.createElement("div"); cnt.className="cnt"; cnt.id = interactive ? "catCnt" : "";
  cnt.textContent = done + " sur " + total + " coché" + (done>1?"s":"");
  tt.append(h2, cnt);
  top.append(ic, tt);

  if(interactive){
    const allDone = total>0 && done===total;
    const allBtn = document.createElement("button");
    allBtn.className="all-btn"; allBtn.id="catAll";
    allBtn.textContent = allDone ? "Tout décocher" : "Tout cocher";
    allBtn.addEventListener("click", ()=>{
      const target = !allDone;
      items.forEach(it=> state[it.key] = target);
      saveState(); renderTabs(); renderContent(); refreshCounts();
    });
    top.appendChild(allBtn);
  }
  card.appendChild(top);

  if(items.length === 0){
    const e = document.createElement("div"); e.className="empty";
    e.textContent = "Rien ici pour l'instant !";
    card.appendChild(e);
  }else{
    const ul = document.createElement("ul"); ul.className="items";
    items.forEach(it=> ul.appendChild(buildRow(it, ci, interactive)));
    card.appendChild(ul);
  }
  return card;
}

function buildRow(it, ci, interactive){
  const li = document.createElement("li");
  li.className = "item" + (state[it.key] ? " checked" : "");

  const box = document.createElement("div"); box.className="box"; box.innerHTML = checkSvg;
  const lbl = document.createElement("div"); lbl.className="lbl"; lbl.textContent = it.label;
  li.append(box, lbl);

  if(interactive){
    const tools = document.createElement("div"); tools.className="tools";
    const ed = document.createElement("button"); ed.className="t-btn"; ed.textContent="✎";
    ed.setAttribute("aria-label","Modifier");
    ed.addEventListener("click", e=>{ e.stopPropagation(); openEdit(it, ci); });
    const dl = document.createElement("button"); dl.className="t-btn"; dl.textContent="✕";
    dl.setAttribute("aria-label","Supprimer");
    dl.addEventListener("click", e=>{ e.stopPropagation(); deleteItem(it, true); });
    tools.append(ed, dl);
    li.appendChild(tools);

    li.addEventListener("click", ()=>{
      state[it.key] = !state[it.key];
      saveState();
      li.classList.toggle("checked", !!state[it.key]);
      refreshCounts();
    });
  }
  return li;
}

/* ---------- Compteurs en direct ---------- */
function refreshCounts(){
  let done=0, total=0;
  DATA.forEach((_,ci)=>{ const c=countCat(ci); done+=c.done; total+=c.total; });
  document.getElementById("gTxt").textContent = done + " / " + total;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("gPct").textContent = pct + "%";
  document.getElementById("gaugeFill").style.width = pct + "%";

  tabsEl.querySelectorAll(".tab").forEach(tab=>{
    const ci = +tab.dataset.ci;
    const c = countCat(ci);
    tab.querySelector(".t-count").textContent = c.done+"/"+c.total;
    tab.classList.toggle("done", c.total>0 && c.done===c.total);
  });

  const c = countCat(activeTab);
  const cnt = document.getElementById("catCnt");
  if(cnt) cnt.textContent = c.done + " sur " + c.total + " coché" + (c.done>1?"s":"");
  const allBtn = document.getElementById("catAll");
  if(allBtn) allBtn.textContent = (c.total>0 && c.done===c.total) ? "Tout décocher" : "Tout cocher";
}

function render(){ renderTabs(); renderContent(); refreshCounts(); }

/* ---------- Actions ---------- */
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("Tout décocher ?")){ state = {}; saveState(); render(); }
});

document.getElementById("pdfBtn").addEventListener("click", ()=>{
  const d = new Date();
  document.getElementById("printMeta").textContent =
    "Édité le " + d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  const extra = document.createElement("div");
  DATA.forEach((_,ci)=>{ if(ci !== activeTab) extra.appendChild(buildCard(ci,false)); });
  app.appendChild(extra);
  window.print();
  extra.remove();
});

function deleteItem(it, ask){
  if(ask && !confirm("Supprimer « " + it.label + " » ?")) return;
  if(it.custom){
    customs = customs.filter(x=>x.id !== it.id); saveCustoms();
  }else{
    if(removed.indexOf(it.key) === -1){ removed.push(it.key); saveRemoved(); }
    if(overrides[it.key]){ delete overrides[it.key]; saveOverrides(); }
  }
  delete state[it.key]; saveState();
  render();
}

/* ---------- Feuille ---------- */
const backdrop = document.getElementById("backdrop");
const sheet    = document.getElementById("sheet");
const fLabel   = document.getElementById("fLabel");
const fCat     = document.getElementById("fCat");
const sheetTitle = document.getElementById("sheetTitle");
const okBtn    = document.getElementById("okBtn");
let mode="add", editRef=null;

function fillCats(sel){
  fCat.innerHTML = "";
  DATA.forEach((cat,ci)=>{
    const o=document.createElement("option");
    o.value=ci; o.textContent=(STYLE[ci]?STYLE[ci][0]:"")+"  "+cat[0];
    fCat.appendChild(o);
  });
  fCat.value = sel;
}
function openSheet(){ backdrop.classList.add("open"); sheet.classList.add("open"); setTimeout(()=>fLabel.focus(),120); }
function closeSheet(){ backdrop.classList.remove("open"); sheet.classList.remove("open"); }

function openAdd(){
  mode="add"; editRef=null;
  sheet.classList.remove("editing");
  sheetTitle.textContent="Ajouter un élément";
  okBtn.textContent="Ajouter";
  fillCats(activeTab); fLabel.value="";
  openSheet();
}
function openEdit(it, ci){
  mode="edit"; editRef={ custom:it.custom, key:it.key, ci, id:it.id };
  sheet.classList.add("editing");
  sheetTitle.textContent="Modifier l'élément";
  okBtn.textContent="Enregistrer";
  fillCats(ci); fLabel.value=it.label;
  openSheet(); setTimeout(()=>fLabel.select(),140);
}
function confirmSheet(){
  const label = fLabel.value.trim();
  if(!label){ fLabel.focus(); return; }
  const ci = parseInt(fCat.value,10);
  const newId = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  if(mode==="add"){
    customs.push({ id:newId(), cat:ci, label }); saveCustoms();
  }else if(editRef.custom){
    const it = customs.find(x=>x.id===editRef.id);
    if(it){ it.label=label; it.cat=ci; saveCustoms(); }
  }else if(ci === editRef.ci){
    overrides[editRef.key] = label; saveOverrides();
  }else{
    if(removed.indexOf(editRef.key)===-1){ removed.push(editRef.key); saveRemoved(); }
    if(overrides[editRef.key]){ delete overrides[editRef.key]; saveOverrides(); }
    const id = newId(); customs.push({ id, cat:ci, label }); saveCustoms();
    if(state[editRef.key]) state["custom_"+id] = true;
    delete state[editRef.key];
  }
  saveState();
  activeTab = ci; localStorage.setItem(KEY+"_tab", ci);
  closeSheet(); render();
}

document.getElementById("fab").addEventListener("click", openAdd);
document.getElementById("cancelBtn").addEventListener("click", closeSheet);
okBtn.addEventListener("click", confirmSheet);
backdrop.addEventListener("click", closeSheet);
fLabel.addEventListener("keydown", e=>{ if(e.key==="Enter") confirmSheet(); });
document.getElementById("sheetDel").addEventListener("click", ()=>{
  if(!editRef) return;
  const it = { custom:editRef.custom, id:editRef.id, key:editRef.key, label:fLabel.value };
  if(confirm("Supprimer « " + fLabel.value + " » ?")){ closeSheet(); deleteItem(it, false); }
});

document.getElementById("version").textContent = "Version " + VERSION + " — " + VERSION_DATE;
render();

/* ---------- Installation en application + hors-ligne ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
