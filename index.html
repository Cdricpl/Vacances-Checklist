<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#FAF6EE">
<title>Checklist Vacances</title>
<style>
  :root{
    --ease:cubic-bezier(.4,0,.2,1);
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

    --bg:#FAF6EE;
    --bg-2:#F2ECE0;
    --card:#FFFFFF;
    --ink:#2E332D;
    --ink-2:#5E655C;
    --ink-3:#8D9289;
    --line:#EAE3D5;
    --line-2:#F1ECE1;
    --brand:#3E7D63;
    --shadow:0 1px 2px rgba(60,60,45,.05), 0 8px 24px rgba(60,60,45,.07);
    --shadow-lg:0 18px 56px rgba(40,40,25,.28);
    --row-hover:#F7F4EC;
    --tick:#FFFFFF;
  }
  :root[data-theme="dark"]{
    --bg:#15171A;
    --bg-2:#1B1E22;
    --card:#212429;
    --ink:#E9E6DE;
    --ink-2:#B4B2A9;
    --ink-3:#878A82;
    --line:#2E3238;
    --line-2:#282C31;
    --brand:#63B394;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.42);
    --shadow-lg:0 18px 56px rgba(0,0,0,.65);
    --row-hover:#262A2F;
    --tick:#15171A;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#15171A; --bg-2:#1B1E22; --card:#212429;
      --ink:#E9E6DE; --ink-2:#B4B2A9; --ink-3:#878A82;
      --line:#2E3238; --line-2:#282C31; --brand:#63B394;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.42);
      --shadow-lg:0 18px 56px rgba(0,0,0,.65);
      --row-hover:#262A2F;
      --tick:#15171A;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:104px;
    transition:background-color .3s var(--ease), color .3s var(--ease);
  }

  /* ================= En-tête ================= */
  header{
    padding:26px 20px 20px;
    text-align:center;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  h1.title{
    margin:0;
    font-family:var(--serif);
    font-weight:600;
    font-size:1.72rem;
    letter-spacing:.2px;
    line-height:1.15;
  }
  h1.title em{
    display:block; font-style:normal;
    color:var(--brand); font-size:1.28rem; margin-top:1px;
  }
  .rule{
    width:52px; height:2px; border-radius:2px;
    background:var(--brand); opacity:.5;
    margin:11px auto 0;
  }
  .tagline{
    font-size:.82rem; color:var(--ink-3); margin-top:10px;
    letter-spacing:.2px;
  }

  .gauge{max-width:440px; margin:20px auto 0;}
  .gauge-txt{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:.78rem; color:var(--ink-3); margin-bottom:7px;
  }
  .gauge-txt b{color:var(--ink); font-weight:600; font-size:.86rem;}
  .gauge-track{
    height:7px; border-radius:8px; background:var(--bg-2); overflow:hidden;
  }
  .gauge-fill{
    height:100%; width:0%; border-radius:8px;
    background:var(--brand);
    transition:width .5s var(--ease);
  }

  .tools-row{
    display:flex; gap:8px; justify-content:center; align-items:center;
    margin:18px auto 0; flex-wrap:nowrap;
  }
  .tool-btn{
    font-family:var(--body); font-size:.78rem; font-weight:500;
    background:var(--card); color:var(--ink-2);
    border:1px solid var(--line);
    padding:9px 14px; border-radius:10px; cursor:pointer;
    white-space:nowrap;
    transition:transform .14s var(--ease), border-color .2s var(--ease);
  }
  .tool-btn:active{transform:scale(.96); border-color:var(--ink-3);}
  .tool-btn.ico{padding:9px 11px;}

  /* ================= Onglets ================= */
  .tabs{
    display:flex; flex-wrap:wrap; gap:7px; justify-content:center;
    padding:16px 14px 4px; max-width:660px; margin:0 auto;
  }
  .tab{
    --c:#777; --t:#EEE;
    display:inline-flex; align-items:center; gap:7px;
    font-size:.77rem; font-weight:500; white-space:nowrap; cursor:pointer;
    background:var(--card); color:var(--ink-2);
    border:1px solid var(--line);
    padding:8px 12px; border-radius:9px;
    transition:transform .14s var(--ease), background .2s var(--ease),
               color .2s var(--ease), border-color .2s var(--ease);
  }
  .tab:active{transform:scale(.96);}
  .tab .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--c); flex-shrink:0;
    transition:background .2s var(--ease);
  }
  .tab .n{font-size:.71rem; color:var(--ink-3); font-variant-numeric:tabular-nums;}
  .tab.active{
    background:var(--c); color:var(--tick); border-color:var(--c);
  }
  .tab.active .dot{background:var(--tick); opacity:.72;}
  .tab.active .n{color:var(--tick); opacity:.72;}
  .tab.full .dot{background:var(--c); box-shadow:0 0 0 3px var(--t);}
  .tab.active.full .dot{box-shadow:none;}

  /* ================= Carte catégorie ================= */
  main{max-width:560px; margin:0 auto; padding:14px 16px 0;}

  .cat{
    --c:#777; --t:#EEE;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
    animation:fade .3s var(--ease);
  }
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  .cat-top{
    display:flex; align-items:center; gap:13px;
    padding:16px 16px 15px;
    background:var(--t);
    border-bottom:1px solid var(--line-2);
  }
  .cat-ico{
    width:40px; height:40px; border-radius:11px; flex-shrink:0;
    background:var(--card);
    display:flex; align-items:center; justify-content:center;
    font-size:1.2rem;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .cat-tt{flex:1; min-width:0;}
  .cat-tt h2{
    margin:0; font-family:var(--serif); font-weight:600;
    font-size:1.16rem; color:var(--c); line-height:1.2;
  }
  .cat-tt .cnt{font-size:.76rem; color:var(--ink-3); margin-top:3px;}
  .all-btn{
    flex-shrink:0;
    font-size:.72rem; font-weight:500;
    background:var(--card); color:var(--c);
    border:1px solid var(--line);
    padding:8px 12px; border-radius:9px; cursor:pointer;
    transition:transform .14s var(--ease);
  }
  .all-btn:active{transform:scale(.94);}

  .items{list-style:none; margin:0; padding:6px;}
  .item{
    display:flex; align-items:center; gap:13px;
    padding:11px 10px; border-radius:11px;
    cursor:pointer;
    transition:background .2s var(--ease);
  }
  .item + .item{
    box-shadow:inset 0 1px 0 var(--line-2);
  }
  .item:active{background:var(--row-hover);}

  .box{
    width:22px; height:22px; min-width:22px;
    border:2px solid var(--c); border-radius:7px;
    color:var(--tick);
    display:flex; align-items:center; justify-content:center;
    opacity:.55;
    transition:background .2s var(--ease), opacity .2s var(--ease);
  }
  .item.checked .box{background:var(--c); opacity:1;}
  .box svg{width:13px; height:13px;}
  .box svg polyline{
    stroke-dasharray:24; stroke-dashoffset:24;
    transition:stroke-dashoffset .28s var(--ease) .02s;
  }
  .item.checked .box svg polyline{stroke-dashoffset:0;}

  .lbl{
    flex:1; min-width:0; font-size:.94rem; line-height:1.35;
    word-break:break-word;
    transition:color .2s var(--ease);
  }
  .item.checked .lbl{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--ink-3);}

  .tools{display:flex; gap:0; flex-shrink:0; opacity:.55;}
  .t-btn{
    width:30px; height:30px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; color:var(--ink-2);
    font-size:.88rem; cursor:pointer;
    transition:transform .14s var(--ease), background .2s var(--ease);
  }
  .t-btn:active{transform:scale(.86); background:var(--row-hover);}

  .empty{padding:28px 16px; text-align:center; color:var(--ink-3); font-size:.87rem;}

  /* ================= FAB ================= */
  .fab{
    position:fixed; right:18px; bottom:24px; z-index:25;
    height:50px; padding:0 20px; border-radius:25px;
    background:var(--brand); color:var(--tick); border:none; cursor:pointer;
    font-family:var(--body); font-size:.88rem; font-weight:600;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 6px 20px rgba(62,125,99,.35);
    transition:transform .16s var(--ease);
  }
  .fab .p{font-size:1.25rem; font-weight:400; line-height:1; margin-top:-1px;}
  .fab:active{transform:scale(.94);}

  footer{
    text-align:center; color:var(--ink-3);
    font-size:.75rem; margin:28px auto 12px; padding:0 20px;
  }
  footer .ver{display:block; font-size:.68rem; opacity:.7; margin-top:5px;}

  /* ================= Feuille ================= */
  .backdrop{
    position:fixed; inset:0; z-index:40;
    background:rgba(25,28,22,.42); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .26s var(--ease);
  }
  .backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    margin:0 auto; max-width:460px;
    background:var(--card);
    border-radius:20px 20px 0 0;
    box-shadow:var(--shadow-lg);
    padding:8px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(110%); transition:transform .32s var(--ease);
  }
  .sheet.open{transform:translateY(0);}
  .grab{width:38px; height:4px; border-radius:4px; background:var(--line); margin:8px auto 16px;}
  .sheet h3{margin:0; font-family:var(--serif); font-weight:600; font-size:1.2rem; color:var(--ink);}
  .field{margin-top:16px;}
  .field label{
    display:block; font-size:.71rem; font-weight:600;
    letter-spacing:.5px; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:7px;
  }
  .field input, .field select{
    width:100%; padding:13px 14px;
    border:1px solid var(--line); border-radius:11px;
    font-size:1rem; background:var(--bg); color:var(--ink);
    font-family:inherit; transition:border-color .2s var(--ease);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--brand);}
  .sheet-actions{display:flex; gap:10px; margin-top:22px;}
  .sheet-actions button{
    flex:1; padding:14px; border-radius:12px;
    font-size:.92rem; font-weight:600; font-family:inherit;
    cursor:pointer; border:1px solid var(--line);
    transition:transform .14s var(--ease);
  }
  .sheet-actions button:active{transform:scale(.97);}
  .btn-cancel{background:var(--card); color:var(--ink-2);}
  .btn-ok{background:var(--brand); color:var(--tick); border-color:var(--brand);}
  .sheet-del{
    display:none; width:100%; margin-top:12px; padding:11px;
    background:none; border:none; color:#B4574A;
    font-size:.84rem; font-weight:500; cursor:pointer; font-family:inherit;
  }
  .sheet.editing .sheet-del{display:block;}

  /* ================= Impression ================= */
  .print-header{display:none;}
  @media print{
    @page{margin:13mm;}
    body{background:#fff; color:#000; padding:0;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    header, .tabs, .fab, footer, .backdrop, .sheet, .tools, .all-btn{display:none !important;}
    .print-header{display:block; margin:0 0 14px; text-align:center;}
    .print-header h1{margin:0; font-family:var(--serif); font-size:19pt; color:#2E332D;}
    .print-header .meta{font-size:8.5pt; color:#666; margin-top:3px;}
    main{max-width:none; padding:0;}
    .cat{break-inside:avoid; box-shadow:none; border:1px solid #bbb;
      margin-bottom:9px; animation:none; border-radius:6px;}
    .cat-top{padding:8px 10px;}
    .cat-ico{width:26px; height:26px; font-size:.95rem; box-shadow:none;}
    .items{padding:2px;}
    .item{padding:4px 8px;}
    .box{opacity:1; border:1.5px solid #555 !important;}
    .item.checked .box{background:#555 !important;}
    .item.checked .box svg polyline{stroke-dashoffset:0 !important;}
  }

  @media (min-width:640px){
    h1.title{font-size:2rem;}
    h1.title em{font-size:1.45rem;}
  }
</style>
</head>
<body>

<header>
  <h1 class="title">Check-list <em>des vacances</em></h1>
  <div class="rule"></div>
  <div class="tagline">Camping en famille · à cocher avant le départ</div>

  <div class="gauge">
    <div class="gauge-txt">
      <span><b id="gTxt">0 / 0</b> préparés</span>
      <b id="gPct">0%</b>
    </div>
    <div class="gauge-track"><div class="gauge-fill" id="gaugeFill"></div></div>
  </div>

  <div class="tools-row">
    <button class="tool-btn" id="pdfBtn">Exporter en PDF</button>
    <button class="tool-btn" id="resetBtn">Tout décocher</button>
    <button class="tool-btn ico" id="themeBtn" aria-label="Changer le thème">🌙</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<div class="print-header">
  <h1>Check-list des vacances</h1>
  <div class="meta" id="printMeta"></div>
</div>

<main id="app"></main>

<button class="fab" id="fab"><span class="p">+</span> Ajouter</button>

<footer>
  Vos coches sont enregistrées sur cet appareil.
  <span class="ver" id="version"></span>
</footer>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="sheetTitle">Ajouter un élément</h3>
  <div class="field">
    <label for="fLabel">Nom de l'élément</label>
    <input type="text" id="fLabel" placeholder="Ex. Sac de couchage" autocomplete="off">
  </div>
  <div class="field">
    <label for="fCat">Catégorie</label>
    <select id="fCat"></select>
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="cancelBtn">Annuler</button>
    <button class="btn-ok" id="okBtn">Ajouter</button>
  </div>
  <button class="sheet-del" id="sheetDel">Supprimer cet élément</button>
</div>

<script>
const DATA = [
  ["Installation & structure", [
    "Tente raclette","Piquets","Tonnelle","Barre de toit","Sangles",
    "Cadenas remorque","Bâches","Cordes","Table","4 chaises","2 chaises camping",
    "2 transats","Table basse","Tapis (x2)",
    "Niveau à bulle (mise à niveau remorque)","Cales de roue"
  ]],
  ["Outillage", [
    "Marteau","Jeu de clés mixtes","Jeu de tournevis cliquet à embouts","Liquide de refroidissement"
  ]],
  ["Sanitaire", [
    "Toilette chimique","Produit toilette chimique","Brosse toilette",
    "Nécessaire de toilette, brosses à dents","Élastiques"
  ]],
  ["Électricité", [
    "Allonge enrouleur","Allonge (x2)","Multiprise (x2)",
    "Rallonge spécifique raccordement électrique camping",
    "Câble USB-C (x2)","Câble USB mini (x2)"
  ]],
  ["Cuisine", [
    "Bonbonne de gaz","Cuisinière à gaz","Briquet long","Couverts","Assiettes","Gobelets","Tasses",
    "Louche","Louche à pâtes","Spatule bois (x2)","Sous-plats (x2)","Planches (x2)","Tire-bouchon",
    "Bouchons verre à vin","Couvercles silicone","Plats (x3)","Tupperware (x5)","Ouvre-boîte",
    "Papier essuie-tout, sopalin","Produit vaisselle",
    "Verres à vin","Mugs","Cafetière italienne (moka)","Saladier / bol","Couteaux",
    "Huile d'olive","Sel / poivre / épices"
  ]],
  ["Rangement & linge", [
    "Étagère à mannes","4 mannes à linge","Étagère (à préciser)",
    "Armoire 3 compartiments (réserve nourriture)","Armoire 5 compartiments (vaisselle)",
    "Essuies (x2)","Torchons (x3)","Éponges (x4)","Balai","Épingles à linge","Sacs poubelle",
    "Raclette de sol","Pelle et balayette","Panier à linge / séchoir","Ciseaux",
    "Kit couture (aiguille, fil)","Marchepied"
  ]],
  ["Froid", [
    "Frigo box","Adaptateur frigo box","Glaçons refroidissants","Glaçons",
    "Réfrigérateur","Glacière électrique"
  ]],
  ["Confort", [
    "Ventilateurs (x2)","Lampe de poche / frontale"
  ]],
  ["Couchage / Literie", [
    "Matelas","Couettes","Oreillers","Draps housse","Doudous enfants","Bouchons d'oreilles"
  ]],
  ["Sacs & affaires personnelles", [
    "Sac à dos glacière","Sac à dos rando","Sac à dos normal","Sac de courses",
    "Sacs de vêtements (x4)","Vêtements roses (Oscar / Cédric / Wivine)","Colecons",
    "Chaussures (baskets, sandales, crocs)","Casquettes / chapeaux","Valise","Penderie (armoire toile)"
  ]],
  ["Papiers & argent", [
    "Carte d'identité / passeport","Carte européenne d'assurance maladie",
    "Attestation d'assurance camping / remorque","Espèces + carte bancaire",
    "Permis de conduire, carte grise remorque"
  ]],
  ["Pharmacie", [
    "Trousse de premiers secours","Médicaments habituels / ordonnances",
    "Crème solaire, après-soleil","Anti-moustique","Thermomètre, pansements"
  ]],
  ["Électronique", [
    "Chargeurs téléphone / GPS","Batterie externe","Appareil photo"
  ]],
  ["Enfant", [
    "Jeux / jouets, livres","Vélo + casque","Brassards ou gilet si baignade",
    "Poupée","Ballon","Jeu de société"
  ]]
];

/* icône · couleur · fond clair · fond sombre */
const STYLE = [
  ["⛺","#5E8C6A","#EDF3EE","#1E2A22"],
  ["🔧","#55809E","#EAF1F6","#1B252C"],
  ["🚿","#7B6BA8","#EFEDF7","#232130"],
  ["🔌","#9C7E36","#F6F0E1","#2A2519"],
  ["🍳","#B4634F","#F8ECE8","#2D211D"],
  ["🧺","#A9743E","#F7EFE5","#2B241A"],
  ["❄️","#3E8A93","#E9F3F4","#192628"],
  ["🌬️","#A45876","#F7EBF0","#2B1E24"],
  ["🛏️","#5A6BA5","#ECEEF7","#1F232F"],
  ["🎒","#6E8C43","#F0F4E7","#222819"],
  ["📄","#8A7448","#F4F0E6","#26221A"],
  ["💊","#AA5555","#F7EBEB","#2B1E1E"],
  ["🔋","#3F8574","#E9F3F0","#1A2724"],
  ["🧸","#A8823F","#F7F0E2","#2B2519"]
];

const VERSION = "3.1";
const VERSION_DATE = "25/07/2026";
const KEY = "checklist_vacances_v1";

/* ---------- Persistance ---------- */
function load(k, def){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? def; }catch(e){ return def; } }
let state     = load(KEY, {});
let customs   = load(KEY+"_custom", []);
let overrides = load(KEY+"_over", {});
let removed   = load(KEY+"_removed", []);
let activeTab = parseInt(localStorage.getItem(KEY+"_tab") || "0", 10);
if(isNaN(activeTab) || activeTab < 0 || activeTab >= DATA.length) activeTab = 0;

const save = (k,v)=> localStorage.setItem(k, JSON.stringify(v));
const saveState     = ()=> save(KEY, state);
const saveCustoms   = ()=> save(KEY+"_custom", customs);
const saveOverrides = ()=> save(KEY+"_over", overrides);
const saveRemoved   = ()=> save(KEY+"_removed", removed);

/* ---------- Thème ---------- */
const themeBtn = document.getElementById("themeBtn");
function effectiveTheme(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t) return t;
  return window.matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
}
function isDark(){ return effectiveTheme() === "dark"; }
(function initTheme(){
  const saved = localStorage.getItem(KEY+"_theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  themeBtn.textContent = isDark() ? "☀️" : "🌙";
})();
themeBtn.addEventListener("click", ()=>{
  const next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(KEY+"_theme", next);
  themeBtn.textContent = next==="dark" ? "☀️" : "🌙";
  render();
});

/* ---------- Données fusionnées ---------- */
function getItems(ci){
  const list = [];
  DATA[ci][1].forEach((label, ii)=>{
    const key = "c"+ci+"_i"+ii;
    if(removed.indexOf(key) !== -1) return;
    list.push({ key, label: overrides[key] || label, custom:false });
  });
  customs.forEach(it=>{
    if(it.cat === ci) list.push({ key:"custom_"+it.id, label:it.label, custom:true, id:it.id });
  });
  return list;
}
function countCat(ci){
  const items = getItems(ci);
  return { done: items.filter(it=>state[it.key]).length, total: items.length };
}
/* éclaircit une couleur hex vers le blanc (0 = inchangé, 1 = blanc) */
function lighten(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  const mix = v => Math.round(v + (255 - v) * amt);
  return "#" + [mix(r),mix(g),mix(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
/* couleur d'accent et fond de bandeau selon le thème */
function palette(ci){
  const s = STYLE[ci] || ["•","#777777","#EEEEEE","#222222"];
  return {
    ico: s[0],
    c: isDark() ? lighten(s[1], .34) : s[1],
    t: isDark() ? s[3] : s[2]
  };
}

const app    = document.getElementById("app");
const tabsEl = document.getElementById("tabs");
const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

/* ---------- Onglets ---------- */
function renderTabs(){
  tabsEl.innerHTML = "";
  DATA.forEach((cat, ci)=>{
    const p = palette(ci);
    const {done, total} = countCat(ci);
    const tab = document.createElement("button");
    tab.className = "tab" + (ci===activeTab?" active":"") + (total>0 && done===total ? " full" : "");
    tab.dataset.ci = ci;
    tab.style.setProperty("--c", p.c);
    tab.style.setProperty("--t", p.t);

    const d = document.createElement("span"); d.className="dot";
    const n = document.createElement("span"); n.textContent = cat[0];
    const c = document.createElement("span"); c.className="n"; c.textContent = done+"/"+total;
    tab.append(d, n, c);

    tab.addEventListener("click", ()=>{
      if(ci === activeTab) return;
      activeTab = ci;
      localStorage.setItem(KEY+"_tab", ci);
      renderTabs(); renderContent();
      window.scrollTo({ top: tabsEl.offsetTop - 10, behavior:"smooth" });
    });
    tabsEl.appendChild(tab);
  });
}

/* ---------- Carte catégorie ---------- */
function renderContent(){
  app.innerHTML = "";
  app.appendChild(buildCard(activeTab, true));
}

function buildCard(ci, interactive){
  const p = palette(ci);
  const items = getItems(ci);
  const {done, total} = countCat(ci);

  const card = document.createElement("section");
  card.className = "cat";
  card.style.setProperty("--c", p.c);
  card.style.setProperty("--t", p.t);

  const top = document.createElement("div"); top.className = "cat-top";
  const ic = document.createElement("div"); ic.className = "cat-ico"; ic.textContent = p.ico;
  const tt = document.createElement("div"); tt.className = "cat-tt";
  const h2 = document.createElement("h2"); h2.textContent = DATA[ci][0];
  const cnt = document.createElement("div"); cnt.className = "cnt";
  if(interactive) cnt.id = "catCnt";
  cnt.textContent = done + " sur " + total + " coché" + (done>1?"s":"");
  tt.append(h2, cnt);
  top.append(ic, tt);

  if(interactive){
    const allDone = total>0 && done===total;
    const allBtn = document.createElement("button");
    allBtn.className = "all-btn"; allBtn.id = "catAll";
    allBtn.textContent = allDone ? "Tout décocher" : "Tout cocher";
    allBtn.addEventListener("click", ()=>{
      const target = !allDone;
      items.forEach(it=> state[it.key] = target);
      saveState(); renderTabs(); renderContent(); refreshCounts();
    });
    top.appendChild(allBtn);
  }
  card.appendChild(top);

  if(items.length === 0){
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = "Aucun élément dans cette catégorie.";
    card.appendChild(e);
  }else{
    const ul = document.createElement("ul"); ul.className = "items";
    items.forEach(it=> ul.appendChild(buildRow(it, ci, interactive)));
    card.appendChild(ul);
  }
  return card;
}

function buildRow(it, ci, interactive){
  const li = document.createElement("li");
  li.className = "item" + (state[it.key] ? " checked" : "");

  const box = document.createElement("div"); box.className = "box"; box.innerHTML = checkSvg;
  const lbl = document.createElement("div"); lbl.className = "lbl"; lbl.textContent = it.label;
  li.append(box, lbl);

  if(interactive){
    const tools = document.createElement("div"); tools.className = "tools";
    const ed = document.createElement("button"); ed.className="t-btn"; ed.textContent="✎";
    ed.setAttribute("aria-label","Modifier");
    ed.addEventListener("click", e=>{ e.stopPropagation(); openEdit(it, ci); });
    const dl = document.createElement("button"); dl.className="t-btn"; dl.textContent="✕";
    dl.setAttribute("aria-label","Supprimer");
    dl.addEventListener("click", e=>{ e.stopPropagation(); deleteItem(it, true); });
    tools.append(ed, dl);
    li.appendChild(tools);

    li.addEventListener("click", ()=>{
      state[it.key] = !state[it.key];
      saveState();
      li.classList.toggle("checked", !!state[it.key]);
      refreshCounts();
    });
  }
  return li;
}

/* ---------- Compteurs en direct ---------- */
function refreshCounts(){
  let done=0, total=0;
  DATA.forEach((_,ci)=>{ const c=countCat(ci); done+=c.done; total+=c.total; });
  document.getElementById("gTxt").textContent = done + " / " + total;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("gPct").textContent = pct + "%";
  document.getElementById("gaugeFill").style.width = pct + "%";

  tabsEl.querySelectorAll(".tab").forEach(tab=>{
    const ci = +tab.dataset.ci;
    const c = countCat(ci);
    tab.querySelector(".n").textContent = c.done+"/"+c.total;
    tab.classList.toggle("full", c.total>0 && c.done===c.total);
  });

  const c = countCat(activeTab);
  const cnt = document.getElementById("catCnt");
  if(cnt) cnt.textContent = c.done + " sur " + c.total + " coché" + (c.done>1?"s":"");
  const allBtn = document.getElementById("catAll");
  if(allBtn) allBtn.textContent = (c.total>0 && c.done===c.total) ? "Tout décocher" : "Tout cocher";
}

function render(){ renderTabs(); renderContent(); refreshCounts(); }

/* ---------- Actions ---------- */
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("Tout décocher ?")){ state = {}; saveState(); render(); }
});

document.getElementById("pdfBtn").addEventListener("click", ()=>{
  const d = new Date();
  document.getElementById("printMeta").textContent =
    "Édité le " + d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  const extra = document.createElement("div");
  DATA.forEach((_,ci)=>{ if(ci !== activeTab) extra.appendChild(buildCard(ci,false)); });
  app.appendChild(extra);
  window.print();
  extra.remove();
});

function deleteItem(it, ask){
  if(ask && !confirm("Supprimer « " + it.label + " » ?")) return;
  if(it.custom){
    customs = customs.filter(x=>x.id !== it.id); saveCustoms();
  }else{
    if(removed.indexOf(it.key) === -1){ removed.push(it.key); saveRemoved(); }
    if(overrides[it.key]){ delete overrides[it.key]; saveOverrides(); }
  }
  delete state[it.key]; saveState();
  render();
}

/* ---------- Feuille ---------- */
const backdrop = document.getElementById("backdrop");
const sheet    = document.getElementById("sheet");
const fLabel   = document.getElementById("fLabel");
const fCat     = document.getElementById("fCat");
const sheetTitle = document.getElementById("sheetTitle");
const okBtn    = document.getElementById("okBtn");
let mode="add", editRef=null;

function fillCats(sel){
  fCat.innerHTML = "";
  DATA.forEach((cat,ci)=>{
    const o=document.createElement("option");
    o.value=ci; o.textContent=(STYLE[ci]?STYLE[ci][0]:"")+"  "+cat[0];
    fCat.appendChild(o);
  });
  fCat.value = sel;
}
function openSheet(){ backdrop.classList.add("open"); sheet.classList.add("open"); setTimeout(()=>fLabel.focus(),120); }
function closeSheet(){ backdrop.classList.remove("open"); sheet.classList.remove("open"); }

function openAdd(){
  mode="add"; editRef=null;
  sheet.classList.remove("editing");
  sheetTitle.textContent="Ajouter un élément";
  okBtn.textContent="Ajouter";
  fillCats(activeTab); fLabel.value="";
  openSheet();
}
function openEdit(it, ci){
  mode="edit"; editRef={ custom:it.custom, key:it.key, ci, id:it.id };
  sheet.classList.add("editing");
  sheetTitle.textContent="Modifier l'élément";
  okBtn.textContent="Enregistrer";
  fillCats(ci); fLabel.value=it.label;
  openSheet(); setTimeout(()=>fLabel.select(),140);
}
function confirmSheet(){
  const label = fLabel.value.trim();
  if(!label){ fLabel.focus(); return; }
  const ci = parseInt(fCat.value,10);
  const newId = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  if(mode==="add"){
    customs.push({ id:newId(), cat:ci, label }); saveCustoms();
  }else if(editRef.custom){
    const it = customs.find(x=>x.id===editRef.id);
    if(it){ it.label=label; it.cat=ci; saveCustoms(); }
  }else if(ci === editRef.ci){
    overrides[editRef.key] = label; saveOverrides();
  }else{
    if(removed.indexOf(editRef.key)===-1){ removed.push(editRef.key); saveRemoved(); }
    if(overrides[editRef.key]){ delete overrides[editRef.key]; saveOverrides(); }
    const id = newId(); customs.push({ id, cat:ci, label }); saveCustoms();
    if(state[editRef.key]) state["custom_"+id] = true;
    delete state[editRef.key];
  }
  saveState();
  activeTab = ci; localStorage.setItem(KEY+"_tab", ci);
  closeSheet(); render();
}

document.getElementById("fab").addEventListener("click", openAdd);
document.getElementById("cancelBtn").addEventListener("click", closeSheet);
okBtn.addEventListener("click", confirmSheet);
backdrop.addEventListener("click", closeSheet);
fLabel.addEventListener("keydown", e=>{ if(e.key==="Enter") confirmSheet(); });
document.getElementById("sheetDel").addEventListener("click", ()=>{
  if(!editRef) return;
  const it = { custom:editRef.custom, id:editRef.id, key:editRef.key, label:fLabel.value };
  if(confirm("Supprimer « " + fLabel.value + " » ?")){ closeSheet(); deleteItem(it, false); }
});

document.getElementById("version").textContent = "Version " + VERSION + " — " + VERSION_DATE;
render();
</script>
</body>
</html>
